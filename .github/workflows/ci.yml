name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # the end-to-end tests drive a ConPTY, so this has to be Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
